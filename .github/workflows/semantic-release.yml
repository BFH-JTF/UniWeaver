# This file configures semantic-release - a customizable release automation tool - using GitHub actions.
#
# The main branch is protected: changes only land via pull requests. This
# pipeline is therefore protection-compatible:
#
#   1. semantic-release analyzes commits and creates the git tag + GitHub
#      release via the GitHub API (API calls are not subject to the branch
#      push ruleset).
#   2. The release produced one artifact in the workspace: a bumped
#      package.json/package-lock.json (via @semantic-release/npm with
#      npmPublish: false). Those are picked up by create-pull-request, which
#      pushes them to the chore/version-bump branch and opens (or updates) a
#      PR against main - respecting "changes must be made through a PR".
#   3. The bump PR is auto-merged (squash); its chore: commit is not
#      releasable, so no release loop occurs. Right after the merge the
#      chore/version-bump branch is deleted, so no stale bump branch lingers
#      between releases - it is recreated fresh by the next release.
#
# No step ever pushes directly to main.

name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify token
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "RELEASE_TOKEN is empty!"
          else
            echo "RELEASE_TOKEN is set (length: ${#RELEASE_TOKEN})"
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install dependencies
        run: npm ci

      - name: Record current version
        id: before
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semantic
        # semantic-release prints its result but does not set action outputs
        # by itself; capture the published version from its log output.
        run: |
          npx semantic-release | tee /tmp/semantic-release.log
          if grep -q "Published release" /tmp/semantic-release.log; then
            VERSION="$(grep -oE "Published release [0-9]+\.[0-9]+\.[0-9]+" /tmp/semantic-release.log | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release published: $VERSION"
          else
            echo "no release published"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Create version bump pull request
        id: bump
        if: steps.semantic.outputs.new_release_version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: chore/version-bump
          base: main
          # Safety net: the action itself only deletes the branch lazily on a
          # later run when there is no diff; on-merge deletion happens in the
          # auto-merge step below.
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          commit-message: |
            chore(release): v${{ steps.semantic.outputs.new_release_version }}

            Automated version sync after release v${{ steps.semantic.outputs.new_release_version }}.
          title: "chore(release): v${{ steps.semantic.outputs.new_release_version }}"
          body: |
            Automated version-bump PR for release **v${{ steps.semantic.outputs.new_release_version }}**.

            - Updates `package.json` / `package-lock.json` to `${{ steps.semantic.outputs.new_release_version }}`
            - The git tag and GitHub release were already created by semantic-release
            - This PR is auto-merged; its commit is not releasable (no loop)

            Triggered by push to main (`${{ github.sha }}`).
          labels: |
            release
            automated

      - name: Auto-merge version bump PR and delete its branch
        if: steps.bump.outputs.pull-request-number != ''
        run: |
          PR_NUMBER="${{ steps.bump.outputs.pull-request-number }}"
          BRANCH="${{ steps.bump.outputs.pull-request-branch }}"
          echo "Auto-merging version bump PR #$PR_NUMBER"
          # Squash-merge via the RELEASE_TOKEN (ruleset permits PR merges).
          # Retry a few times: the PR is brand-new, so checks may need a moment.
          scheduled=0
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --auto 2>&1; then
              echo "Auto-merge scheduled"
              scheduled=1
              break
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          if [ "$scheduled" != "1" ]; then
            echo "::warning::Could not enable auto-merge for PR #$PR_NUMBER - merge it manually."
            exit 0
          fi
          # Wait for the merge to complete so the bump branch can be deleted
          # deterministically (delete-branch above cannot delete on merge).
          merged=0
          for attempt in 1 2 3 4 5 6 7 8 9; do
            STATE="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state --jq .state 2>/dev/null || echo unknown)"
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged"
              merged=1
              break
            fi
            echo "Waiting for merge (state: $STATE), attempt $attempt..."
            sleep 10
          done
          if [ "$merged" != "1" ]; then
            echo "::warning::PR #$PR_NUMBER not merged yet - bump branch kept."
            exit 0
          fi
          # Delete the bump branch so it cannot linger/diverge from main.
          if gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" 2>&1; then
            echo "Bump branch '$BRANCH' deleted"
          else
            echo "::warning::Could not delete bump branch '$BRANCH' - delete it manually."
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
