services:
  postgres:
    image: postgres:16-alpine
    container_name: uniweaver-postgres
    environment:
      POSTGRES_DB: uniweaver
      POSTGRES_USER: uniweaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniweaver}
    ports:
      - "5432:5432"
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniweaver -d uniweaver"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/bfh-jtf/uniweaver:${UNIWEAVER_TAG:-sha-893058b}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniweaver-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: uniweaver
      POSTGRES_USER: uniweaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniweaver}
      SESSION_SECRET: ${SESSION_SECRET:-please-set-a-proper-session-secret-with-at-least-32-chars}
      BOOTSTRAP_ADMIN_SECRET: ${BOOTSTRAP_ADMIN_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:3000/oidc}
      # Issuer URL as reachable from inside the docker network (backend -> provider).
      # Deliberately NOT read from OIDC_INTERNAL_ISSUER: that variable in .env
      # holds the host-visible URL (http://localhost:3030/oidc) used when the
      # backend runs via `npm run dev`. Override with OIDC_INTERNAL_ISSUER_DOCKER.
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER_DOCKER:-http://doc-pouch:3030/oidc}
      # Optional: pin the aud claim to this client. Leave empty when the SPA
      # self-registers its OIDC client via dynamic registration.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-docPouch}
      USER_ENTRY_URL: ${USER_ENTRY_URL:-http://localhost:3000/user_entry}
      ADMINISTRATION_URL: ${ADMINISTRATION_URL:-http://localhost:3000/administration}
      SCHEDULING_URL: ${SCHEDULING_URL:-http://localhost:3000/scheduling}
      COMPETENCIES_URL: ${COMPETENCIES_URL:-http://localhost:3000/competencies}
      # Solver microservice (schedule generation). As an essential part of
      # UniWeaver it is a regular compose service, not profile-gated.
      SCHEDULER_URL: ${SCHEDULER_URL:-http://scheduler:8081}
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_started
    restart: unless-stopped

  # UniWeaver scheduling service: Timefold-based timetabling solver, consumed
  # by the backend over REST (POST /api/schedules, poll GET /:jobId).
  scheduler:
    image: ghcr.io/bfh-jtf/uniweaver-scheduler:${UNIWEAVER_TAG:-sha-893058b}
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: uniweaver-scheduler
    ports:
      # Published for optional direct access; the backend talks to it over
      # the internal network (SCHEDULER_URL).
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  # OIDC identity provider service (docPouch instance as an OIDC provider).
  # docPouch is not used as data storage. Not behind a compose profile: login
  # depends on it, and a profile-gated service is destroyed whenever compose
  # runs without --profile oidc (which took the provider down repeatedly).
  # To use an external identity provider instead, remove this service and
  # point OIDC_ISSUER / OIDC_INTERNAL_ISSUER at your provider.
  doc-pouch:
    image: ghcr.io/bfh-jtf/doc-pouch:latest
    container_name: uniweaver-docpouch-oidc
    ports:
      # Provider is reached through the app's same-origin /oidc proxy; the
      # direct port is only published for optional admin access to docPouch.
      - "127.0.0.1:3030:3030"
    volumes:
      - "./docpouch-db:/app/db"
      - "./docpouch-log:/app/log"
    env_file: .env
    restart: unless-stopped
